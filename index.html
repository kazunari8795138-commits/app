<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研修設計シート — Design Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/pptxgen.bundle.js"></script>
</head>
<body>

<header class="top">
  <div class="eyebrow">Training Design Sheet · Interactive</div>
  <h1 class="title">研修設計シート</h1>
  <div class="sub">クライアント属性を選ぶと、各設問に応じたフォロー選択肢が5つ表示されます。選ぶ・書く、どちらでも進められます。</div>
</header>

<div class="wrap">
  <div class="desk">
    <div class="field-row">
      <div class="field company">
        <label for="f-title">研修名</label>
        <input type="text" id="f-title" placeholder="例）イグニッション">
      </div>
    </div>
    <div class="field-row" style="margin-top:18px;">
      <div class="field">
        <label for="f-industry">クライアントの業種</label>
        <select id="f-industry"></select>
        <div class="other-note" id="other-note">「その他」を選んだ場合は、実際の業種に一番近いものを上のリストから選び直すことをおすすめします。近い業種を選ぶことで、より的確な選択肢が表示されます。</div>
      </div>
      <div class="field">
        <label for="f-position">対象の職位階層</label>
        <select id="f-position"></select>
      </div>
      <div class="field">
        <label for="f-tenure">対象の勤続年数</label>
        <select id="f-tenure"></select>
      </div>
    </div>
  </div>

  <div id="sections"></div>
</div>

<footer class="bottom">
  <span id="progress">0 / 0 問 回答済み</span>
  <div style="display:flex;gap:10px;">
    <button type="button" class="export-btn secondary" id="export-btn">テキストで書き出す</button>
    <button type="button" class="export-btn" id="pptx-btn">PowerPointで書き出す</button>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
